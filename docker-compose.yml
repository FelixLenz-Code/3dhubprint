services:
  printhub:
    build: .
    image: printhub:latest
    container_name: printhub
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: 8080
    # Only on one interface, e.g. "192.168.1.20:8080:8080" (LAN IP of this host).
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data

  # Optional: docker compose --profile spoolman up
  spoolman:
    image: ghcr.io/donkie/spoolman:0.27.0
    profiles: [spoolman]
    restart: unless-stopped
    # No login: keep it in the LAN (or bind it like above), never forward it through the proxy.
    ports:
      - "7912:8000"
    volumes:
      - ./spoolman:/home/app/.local/share/spoolman
